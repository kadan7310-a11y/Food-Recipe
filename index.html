<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Recipe App</title>
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family: Arial;}
    body{background:#fff7ed;}
    header{background:#ff7b00; color:white; padding:25px; text-align:center;}
    header h1{font-size:32px;}
    .search-box{display:flex; justify-content:center; margin:25px; gap:10px;}
    .search-box input{width:350px; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:16px;}
    .search-box button{padding:12px 20px; background:#ff7b00; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;}
    .container{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; padding:20px; max-width:1200px; margin:auto;}
    .card{background:white; border-radius:15px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.1); cursor:pointer; transition:0.3s;}
    .card:hover{transform:translateY(-5px);}
    .card img{width:100%; height:180px; object-fit:cover;}
    .card-body{padding:15px;}
    .card-body h3{font-size:18px; margin-bottom:5px;}
    .card-body p{font-size:14px; color:#777;}
  </style>
</head>
<body>

<header>
  <h1> Food Recipe Finder</h1>
  <p>Search any food - e.g. Chicken, Pizza, Cake</p>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search recipe...">
  <button id="searchBtn">Search</button>
</div>

<div class="container" id="recipeContainer">
  <!-- Recipes will come here -->
</div>

<script src="index.js"></script>
</body>
</html>
